[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "waheed-backend"
version = "0.1.0"
description = "Waheed System API: Django + django-tenants, one PostgreSQL schema per Restaurant"
requires-python = ">=3.10,<3.11"
dependencies = [
  "Django==5.2.17",
  "django-tenants==3.14.0",
  "djangorestframework==3.18.0",
  "djangorestframework-simplejwt==5.5.1",
  "psycopg[binary]>=3.2.1,<3.3",
  "celery[redis]==5.6.3",
  # The plan pinned redis 8.1.0; kombu 5.6 (Celery 5.6.3) requires redis<6.5.
  "redis==6.4.0",
  "django-cors-headers==4.9.0",
  "django-environ==0.14.0",
  "google-genai==2.22.0",
  "openai==3.8.0",
  "gunicorn==26.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-django==4.14.0",
  "ruff==0.16.6",
  "factory-boy==3.3.3",
]

# This is a Django project, not a library: installing it only pulls in the
# dependencies above. Nothing is packaged.
[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "DJ"]
# CLAUDE.md: Python 3.10 style keeps typing.Optional / typing.Union.
ignore = ["UP007", "UP045"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "waheed.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
